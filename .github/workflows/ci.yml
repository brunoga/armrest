name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # setup-go's cache is keyed on go.sum alone, which every library
      # bump changes; this one falls back to the newest cache of the job,
      # so a pull request rebuilds only what changed (Fyne's C code takes
      # minutes from scratch).
      - name: Locate Go's caches
        id: go-cache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-

      - name: Install Fyne's build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        # The UI tests render the screens with Fyne's software driver and
        # compare them with the screenshots in testdata: no display needed.
        run: go test -race ./...

      - name: Upload screenshots that differ
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-screenshots
          path: "**/testdata/failed/"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # setup-go's cache is keyed on go.sum alone, which every library
      # bump changes; this one falls back to the newest cache of the job,
      # so a pull request rebuilds only what changed (Fyne's C code takes
      # minutes from scratch).
      - name: Locate Go's caches
        id: go-cache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-

      - name: Install Fyne's build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout 5m

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Fyne uses cgo for OpenGL, so each desktop builds on its own OS.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # setup-go's cache is keyed on go.sum alone, which every library
      # bump changes; this one falls back to the newest cache of the job,
      # so a pull request rebuilds only what changed (Fyne's C code takes
      # minutes from scratch).
      - name: Locate Go's caches
        id: go-cache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-

      - name: Install Fyne's build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build
        shell: bash
        # Windows links MinGW's runtime in statically, and gets no console
        # window. Linux and macOS cannot be fully static: OpenGL comes from
        # the system's driver, and macOS only links its libSystem
        # dynamically.
        run: |
          flags="-s -w"
          if [[ "$RUNNER_OS" == Windows ]]; then flags="$flags -H windowsgui -extldflags=-static"; fi
          go build -ldflags "$flags" -o armrest-bin ./cmd/armrest

      - name: Check it needs nothing the OS lacks
        shell: bash
        run: scripts/check-deps.sh armrest-bin

  android:
    name: Build (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # setup-go's cache is keyed on go.sum alone, which every library
      # bump changes; this one falls back to the newest cache of the job,
      # so a pull request rebuilds only what changed (Fyne's C code takes
      # minutes from scratch).
      - name: Locate Go's caches
        id: go-cache
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ github.job }}-

      - name: Install the fyne tool
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package
        # The runner has the Android NDK installed.
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" make android

      - name: Check it needs nothing Android lacks
        run: scripts/check-deps.sh Armrest.apk

      - uses: actions/upload-artifact@v7
        with:
          name: armrest-android
          path: Armrest.apk

  # Summary job so branch protection can require a single "Build" check.
  build-summary:
    name: Build
    needs: [build, android]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all builds passed
        run: |
          if [[ "${{ needs.build.result }}" != "success" || "${{ needs.android.result }}" != "success" ]]; then
            echo "One or more builds failed"
            exit 1
          fi
