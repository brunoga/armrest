name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne's build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        # The UI tests render the screens with Fyne's software driver and
        # compare them with the screenshots in testdata: no display needed.
        run: go test -race ./...

      - name: Upload screenshots that differ
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-screenshots
          path: "**/testdata/failed/"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne's build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout 5m

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Fyne uses cgo for OpenGL, so each desktop builds on its own OS.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne's build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Build
        run: go build -o armrest-bin ./cmd/armrest

  android:
    name: Build (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the fyne tool
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package
        # The runner has the Android NDK installed.
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: make android

      - uses: actions/upload-artifact@v7
        with:
          name: armrest-android
          path: Armrest.apk

  # Summary job so branch protection can require a single "Build" check.
  build-summary:
    name: Build
    needs: [build, android]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all builds passed
        run: |
          if [[ "${{ needs.build.result }}" != "success" || "${{ needs.android.result }}" != "success" ]]; then
            echo "One or more builds failed"
            exit 1
          fi
